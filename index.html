<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="assets/styles.css" />
</head>

<body>
    <header>
        <h1 id="titulo">📝 Gestor de Tareas</h1>
    </header>

    <main>
        <section class="formulario">
            <h2 id="formTitle">Agregar nueva tarea</h2>

            <form id="tareaForm">
                <input type="text" id="tituloTarea" placeholder="Título de la tarea" required />

                <label for="fecha">Fecha de vencimiento</label>
                <input type="date" id="fecha" required />

                <select id="prioridad" required>
                    <option value="">Seleccionar prioridad</option>
                    <option value="baja">Baja</option>
                    <option value="media">Media</option>
                    <option value="alta">Alta</option>
                </select>

                <button type="submit" id="btnSubmit">Agregar</button>
                <button type="button" id="btnCancelar" class="btn-secundario" style="display:none;">Cancelar
                    edición</button>
            </form>
        </section>

        <section class="lista">
            <h2>Tareas</h2>

            <!-- Este panel lo llena JS (HTML interactivo generado desde JS) -->
            <div id="panelControles"></div>

            <ul id="listaTareas"></ul>
            <p id="estadoVacio" class="estado"></p>
        </section>
    </main>

    <!-- Librería externa -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/main.js"></script>
</body>

</html>
